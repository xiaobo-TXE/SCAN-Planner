# ============================================================================
# 文件：config/keypoints.example.yaml —— 预设航点示例
#
# 【这个文件是干什么的】
#   当 navi_mode = 2（预设航点模式）时，用它告诉机器人依次去哪些点。
#   用 run.launch.py 的 keypoints_file:=<本文件路径> 把它传给规划器。
#
# 【格式】
#   fsm.waypoints 是一个“扁平”的浮点数组，每 3 个数字是一个航点(x, y, z)。
#   所以下面 6 个数字 = 2 个航点：(0,0,0.3) 和 (2,0,0.3)。
#   个数必须是 3 的倍数，否则程序启动时会报错。
# ============================================================================
scan_planner_node:
  ros__parameters:
    # 2 = 预设航点模式
    fsm.navi_mode: 2
    # 两个航点：(0.0, 0.0, 0.3) 和 (2.0, 0.0, 0.3)
    # 想加航点，就继续往数组里追加 3 个数字一组即可。
    fsm.waypoints: [0.0, 0.0, 0.3, 2.0, 0.0, 0.3]
