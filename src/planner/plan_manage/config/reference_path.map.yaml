# ============================================================================
# 文件：config/reference_path.map.yaml —— 自带参考路径发布器的示例航点
#
# 【怎么用】
#   ros2 launch scan_planner run.launch.py is_real_world:=false navi_mode:=3 \
#     reference_path_file:=<本文件路径>
#   发布器会先把这条路径发到 initial_path 话题，规划器收到后按它规划全局轨迹。
#
# 【坐标怎么理解】
#   下面每个三元组是 [x, y, z]，z 写的是“地面高度”，规划器还会在此基础上
#   叠加 grid_map.body_height（机器人身体要抬起来的高度），所以这里不用自己加。
#   坐标所在的坐标系由 frame_id 决定（下面写的是 world）。
# ============================================================================
reference_path_publisher:
  ros__parameters:
    # 这条路径写在哪个坐标系下（规划器会按需把它换算到建图用的坐标系）
    frame_id: world
    # 从“收到第一条里程计”到发布路径之间的等待时间（秒），
    # 留一点时间给规划器把订阅建好，避免路径发出去没人收。
    publish_delay_sec: 0.5
    # 航点表：[x, y, z, x, y, z, ...]，至少两个点
    waypoints:
      [-5.5, 5.5, 0.10,
       -5.5, 4.5, 0.30,
       -5.5, 3.5, 0.40,
       -5.5, 2.5, 0.55,
       -5.5, 1.5, 0.70,
       -5.5, 0.5, 0.85,
       -5.5, -0.5, 1.00,
       -5.5, -1.5, 1.20,
       -5.5, -2.5, 1.40,
       -5.5, -3.5, 1.55,
       -5.5, -4.5, 1.55]
