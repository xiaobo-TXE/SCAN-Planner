# ============================================================================
# 文件：config/robots/go2.yaml —— Go2 机型档案
#
# 【数据来源】
#   宇树官方 Go2 参数页（机械规格 / 性能参数）：
#   https://www.unitree.com/go2
#   规格摘要：站立尺寸 70 × 31 × 40 cm，整机约 15 kg；
#   速度 0~2.5 m/s（AIR）/ 0~3.5 m/s（PRO）/ 0~3.7 m/s（X、EDU，最高约 5 m/s）。
#
# 【怎么用】
#   ros2 launch scan_planner run.launch.py robot:=go2
#
# 【只写“与机型相关”的项】
#   下面只覆盖机器人外形与规划速度上限；局部地图尺寸、初始位置、话题名等
#   与场地/驱动栈相关，按实际情况在下面补写或直接用命令行参数。
# ============================================================================
scan_planner_node:
  ros__parameters:
    # 目标怎么来：与 A2 一致用参考路径模式；没有外部全局路径时改成 1
    fsm.navi_mode: 3

    # ---- 机器人外形（由官方站立尺寸换算）----
    # 规划器把机器人看成“前后两个圆柱”：
    #   半径 = 车体半宽 = 0.31/2 ≈ 0.155，取 0.16
    #   前后偏移 = 车体半长 − 半径 = 0.70/2 − 0.16 = 0.19
    # 这样两个圆柱的并集正好覆盖 70 × 32 cm 的站立投影。
    grid_map.double_cylinder_radius: 0.16
    grid_map.double_cylinder_offset: 0.19
    # 站立高度 0.40 m（官方机械规格）。该值会加到参考路径的 z 上
    # （外部给的是地面高度）；若你的路径 z 已包含机身高度，改成 0.0。
    grid_map.body_height: 0.40

    # ---- 速度上限 ----
    # 官方最高 2.5~3.7 m/s（视型号），但那是硬件极限；规划速度上限按
    # 保守值取 1.0 m/s，按场地与步态再调。
    manager.max_vel: 1.0
    optimization.max_vel: 1.0

closed_loop_controller:
  ros__parameters:
    max_vx: 1.0

go2_kinematic_sim:
  ros__parameters:
    max_vx: 1.0

# 以下不是节点参数，由 run.launch.py 读取使用
robot_topics:
  # 真机话题名：按 Go2 上实际运行的 LIO 输出核对/修改
  # （不写则用启动文件里的默认值 /lio/robo/odom 等）
  body_pose: /lio/robo/odom
  sensor_pose: /lio/imu/odom
  cloud: /lio/cloud_world
  # 点云是否已经在世界系下
  cloud_is_world: true
  # 初始位置 [x, y, z]；不写则按 navi_mode 取默认值
  # init: [-19.0, 1.0, 0.25]
